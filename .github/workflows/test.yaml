name: Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: Python ${{ matrix.python }} / Redis ${{ matrix.redis }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04"]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        redis: ["5", "6", "7", "7.2"]
        include:
          - os: ubuntu-24.04
            python: "3.15"
            redis: "7.2"
            experimental: true
    runs-on: ${{ matrix.os }}
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      REDIS_VERSION: ${{ matrix.redis }}

    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.experimental || false }}
          architecture: "x64"
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: deps-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Install dependencies
        run: |
          poetry check --lock
          poetry install --no-interaction
          poetry run python -c "import sys; print(sys.version)"

      - name: Run tests
        run: poetry run pytest

      - name: Build and test distributions
        if: matrix.redis == '7.2'
        run: |
          poetry build
          cd "$RUNNER_TEMP"
          for artifact in "$GITHUB_WORKSPACE"/dist/*; do
            venv="$RUNNER_TEMP/$(basename "$artifact")-venv"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install "$artifact"
            "$venv/bin/iredis" -h
            "$venv/bin/iredis" help GET
            test "$("$venv/bin/iredis" --raw PING)" = PONG
          done
  lint:
    name: flake8 & black
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lint-${{ runner.os }}-3.14-${{ hashFiles('pyproject.toml', '.pre-commit-config.yaml') }}

      - name: Install tools
        run: python -m pip install flake8==7.1.1 black==26.3.1

      - name: Flake8
        run: flake8 .

      - name: Black
        run: black --check .
